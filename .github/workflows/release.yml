name: Release
# Publishes the version in tauri.conf.json to MDHaarith/RoadMap-releases. Runs when a pull
# request into master is merged (CI already passed on it, so it does not run again): both
# platforms, or only one if the pull request has the label "release: linux" or
# "release: windows". A platform already released at this version is skipped, so a merge
# without a version bump releases nothing. Also runs by hand from the Actions tab with the
# two tick boxes.
on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      linux:
        description: Release Linux (AppImage, deb, rpm)
        type: boolean
      windows:
        description: Release Windows (installer)
        type: boolean
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - run: python3 scripts/release-check.py
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          LINUX: ${{ inputs.linux }}
          WINDOWS: ${{ inputs.windows }}
          REF: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            LINUX=$(jq 'index("release: linux") != null' <<<"$LABELS")
            WINDOWS=$(jq 'index("release: windows") != null' <<<"$LABELS")
            # No platform label: release both.
            if [ "$LINUX" = false ] && [ "$WINDOWS" = false ]; then LINUX=true WINDOWS=true; fi
          fi
          version=$(jq -r .version tauri.conf.json)
          # A platform already in this version's release is skipped; bump the version to release it again.
          assets=$(gh release view "v$version" --repo MDHaarith/RoadMap-releases --json assets --jq '.assets[].name' 2>/dev/null || true)
          include='[]'
          if [ "$LINUX" = true ]; then
            if grep -q '\.AppImage$' <<<"$assets"; then echo "Linux v$version is already released."
            else include=$(jq -c '. + [{"platform":"linux","os":"ubuntu-22.04"}]' <<<"$include"); fi
          fi
          if [ "$WINDOWS" = true ]; then
            if grep -q 'setup\.exe$' <<<"$assets"; then echo "Windows v$version is already released."
            else include=$(jq -c '. + [{"platform":"windows","os":"windows-latest"}]' <<<"$include"); fi
          fi
          [ "$include" = '[]' ] && echo "Nothing to release: this version is already released (or no tick box)."
          { echo "version=$version"; echo "ref=$REF"; echo "matrix={\"include\":$include}"; } >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # The key has no password; an empty value stops the signer from asking for one.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build --config tauri.release.conf.json --bundles appimage,deb,rpm -- --locked
      # Inno Setup instead of NSIS: NSIS loads unsigned plugin DLLs that Smart App Control blocks.
      - name: Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          node ui/node_modules/@tauri-apps/cli/tauri.js build --no-bundle -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --bin roadmap-mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/build-windows-installer.ps1 -Version $env:VERSION
          node ui/node_modules/@tauri-apps/cli/tauri.js signer sign "target/release/Roadmap_${env:VERSION}_x64-setup.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: |
            target/release/Roadmap_*_x64-setup.exe
            target/release/Roadmap_*_x64-setup.exe.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/rpm/*.rpm
            target/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      REPO: MDHaarith/RoadMap-releases
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: artifacts
      # Adding a platform to a version that already has the other one keeps both in latest.json.
      - run: gh release download "$TAG" --repo "$REPO" --pattern latest.json --output old-latest.json || true
      - run: python3 scripts/release-manifest.py
      - name: Publish the release
        run: |
          new=false
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target main --draft --title "Roadmap $TAG" --notes "Download the installer for your system."
            new=true
          fi
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          if [ "$new" = true ]; then gh release edit "$TAG" --repo "$REPO" --draft=false --latest; fi
      # The app reads updater/<linux|windows>.json, so each platform moves on its own version.
      # Written after the release is public, so clients never see links to a draft.
      - name: Point the app updater at this release
        run: |
          gh release view updater --repo "$REPO" > /dev/null 2>&1 || gh release create updater --repo "$REPO" --target main --prerelease --latest=false --title "Update manifests" --notes "The app reads linux.json and windows.json here to find updates. Do not delete."
          for f in linux.json windows.json; do
            if [ -f "$f" ]; then gh release upload updater "$f" --repo "$REPO" --clobber; fi
          done
