name: Signed release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate release tag against source versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Select a version tag to release'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/contents/tauri.conf.json?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/tauri-version.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/cargo-version.toml"
          python - <<'PYTHON'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          tauri = json.loads((root / 'tauri-version.json').read_text())['version']
          cargo = re.search(r'^version = "([^"]+)"', (root / 'cargo-version.toml').read_text(), re.M)[1]
          assert os.environ['GITHUB_REF_NAME'] == 'v' + tauri == 'v' + cargo, f'Tag must match Cargo and Tauri versions ({cargo}, {tauri})'
          PYTHON
      - uses: actions/checkout@v4
      - name: Validate all versions
        run: python scripts/release-check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: --config tauri.release.conf.json --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ runner.os }}
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.sig
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Validate release tag against source versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Select a version tag to release'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/contents/tauri.conf.json?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/tauri-version.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/cargo-version.toml"
          python - <<'PYTHON'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          tauri = json.loads((root / 'tauri-version.json').read_text())['version']
          cargo = re.search(r'^version = "([^"]+)"', (root / 'cargo-version.toml').read_text(), re.M)[1]
          assert os.environ['GITHUB_REF_NAME'] == 'v' + tauri == 'v' + cargo, f'Tag must match Cargo and Tauri versions ({cargo}, {tauri})'
          PYTHON
      - uses: actions/checkout@v4
      - run: python3 scripts/release-check.py
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: artifacts
      - run: python3 scripts/release-manifest.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Roadmap $GITHUB_REF_NAME" --notes "Download the installer for your system."
          find artifacts -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" latest.json
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
