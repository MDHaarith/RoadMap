@media(max-width:650px){.cards,.creation,.overview-head,.settings-layout{grid-template-columns:1fr}.creation-story{border-right:0;border-bottom:2px solid var(--ink)}.creation-story svg{display:none}.lesson-layout{grid-template-columns:1fr}.lesson-rail{display:block}.rail-map{width:100%;margin-bottom:16px}.lesson-steps{grid-template-columns:repeat(3,minmax(0,1fr))}.support{position:static;max-height:none}.route-phase{grid-template-columns:1fr}.phase-flag{padding:20px}.intro{flex-wrap:wrap}.route-heading{padding:20px}.top .top-link span{display:none}}

<body>
<header class="top"><a class="brand" href="#/" aria-label="Roadmap library"><svg viewBox="0 0 34 40" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true"><path d="M8 33V24c0-8 18-2 18-11V7"/><circle cx="8" cy="33" r="4" fill="var(--yellow)"/><path d="M22 7h8V1h-8z" fill="currentColor"/></svg>Roadmap</a><a id="ctitle" hidden></a><span class="grow"></span><span class="meter" id="meter" hidden><span class="bar"><i id="bar"></i></span><span id="count"></span></span><a class="top-link" href="#/settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 3-1 4-4 1v8l4 1 1 4h6l1-4 4-1V8l-4-1-1-4z"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></a></header>
<p id="toast" class="err" role="alert" hidden></p><main id="app"></main>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const fmtTutor = s => String(s).split('```').map((p,i)=>i%2?'<pre>'+esc(p.replace(/^[a-z]*\n/,''))+'</pre>':fmt(p).replace(/\n/g,'<br>')).join('');
const enc = s => encodeURIComponent(s).replace(/'/g,'%27');
const href = (c,l) => '#/c/'+enc(c)+(l?'/'+enc(l):'');
const ICONS={Watch:'<path d="m8 4 12 8-12 8z"/>','Learn first':'<path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.5c1 1 1 2 1 3.5h6c0-1.5 0-2.5 1-3.5A6 6 0 0 0 12 2z"/>','Look it up yourself':'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>','Do it yourself':'<path d="M14 5a4 4 0 0 0 5 5l-9 10-5-1-1-4zM4 4l5 5"/>',Practise:'<path d="M4 5h16v14H4zM8 9l2 2-2 2M12 14h4"/>','Done when':'<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>',Tutor:'<path d="M3 4h18v13H9l-5 4v-4H3zM8 10h1m6 0h1"/>','My notes':'<path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/>','Give me a hint':'<path d="M12 3a6 6 0 0 0-4 10l1 4h6l1-4a6 6 0 0 0-4-10zM9 21h6"/>','Quiz me':'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2m0 3v.1"/>','Explain a concept':'<path d="M3 4q5-2 9 1 4-3 9-1v15q-5-2-9 1-4-3-9-1zM12 5v15"/>','Review my work':'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10l2 2 3-4"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="1"/><path d="M16 8V3H3v13h5"/>',flag:'<path d="M5 22V3h14l-3 5 3 5H5"/>',Safety:'<path d="m12 3 10 18H2zM12 9v5m0 3v1"/>'};
const icon = n => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.arrow}</svg>`;
const CHIPS=['Give me a hint','Quiz me','Explain a concept','Review my work'];
let course=null,cur=null,busyKey=null,saveT=null,saveFn=null,toastT=null,activeStep='watch',routeVersion=0,libraryData=[],libraryCfg={},building=false,videoTimer=null;
const chats={},practiceViews={},sessions={},practiceBusy={},practiceFresh={},practiceErrors={},runStates={},visited={};
const S=()=>course.state, all=()=>course.phases.flatMap(p=>p.lessons), find=id=>all().find(l=>l.id===id), keyFor=(c,l)=>c.id+'/'+l.id, chatKey=()=>keyFor(course,cur);
const checked=l=>(l.done||[]).map((_,k)=>!!S().checks[l.id+'#'+k]);
const status=l=>S().done[l.id]?'done':checked(l).some(Boolean)?'part':'';
function normalize(c){c.state ||= {};for(const k of ['checks','done','notes','quiz','code'])c.state[k] ||= {};c.state.last ||= '';return c}
async function api(method,path,body){const r=await fetch('api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed ('+r.status+')');return d}
function toast(m){$('#toast').textContent=m;$('#toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').hidden=true,9000)}
// Keep one pending state snapshot; routing flushes it before replacing the page.
function save(){const c=course;clearTimeout(saveT);saveFn=()=>{saveFn=null;return api('PUT','courses/'+enc(c.id)+'/state',c.state).catch(e=>toast("Couldn't save your progress: "+e.message))};saveT=setTimeout(saveFn,400);renderTop()}
function renderTop(){ $('#meter').hidden=$('#ctitle').hidden=!course;if(!course)return;const ls=all(),n=ls.filter(l=>S().done[l.id]).length;$('#ctitle').textContent=course.title;$('#ctitle').href=href(course.id);$('#count').textContent=n+' / '+ls.length;$('#bar').style.width=(ls.length?n/ls.length*100:0)+'%'}
function miniRoute(n,total,current=null){const count=Math.max(2,Math.min(total||2,7)),points=Array.from({length:count},(_,i)=>({x:8+i*244/(count-1),y:i%2?12:27})),d=points.map((p,i)=>i?`C${(points[i-1].x+p.x)/2} ${points[i-1].y} ${(points[i-1].x+p.x)/2} ${p.y} ${p.x} ${p.y}`:`M${p.x} ${p.y}`).join(' '),done=Math.round(n/(total||1)*count);return `<svg class="mini-route" viewBox="0 0 260 40" role="img" aria-label="${n} of ${total} lessons complete"><path d="${d}"/>${points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="6" class="${i===(current===null?done:Math.min(count-1,Math.round(current/Math.max(1,total-1)*(count-1))))?'here':i<done?'done':''}"/>`).join('')}</svg>`}
const loadingArt=()=>'<svg class="loader-route" viewBox="0 0 160 60" aria-hidden="true"><path d="M8 48h25c35 0 0-36 35-36h48q36 0 36 32"/><circle cx="8" cy="48" r="7"/><circle cx="152" cy="44" r="7"/></svg>';
function creationForm(empty=false){return `<div class="intro"><div><div class="kicker">${icon('flag')} Your next adventure</div><h1>What will you make?</h1><p>Pick a real goal. We’ll turn it into a route you can follow, one lesson at a time.</p></div>${!empty?'<button class="btn secondary" id="cancel-new" type="button">Back to library</button>':''}</div>${libraryCfg.base&&libraryCfg.model?'':'<p class="note">Connect an AI service in <a href="#/settings">Settings</a> before building your roadmap.</p>'}<div class="creation"><div class="creation-story"><h2>A goal.<br>A route.<br>Your own work.</h2>${loadingArt()}<p>Free videos, things to try, and a tutor for the moments you get stuck.</p></div><form id="new"><label for="prompt">I want to…</label><textarea id="prompt" rows="3" required placeholder="Build a weather station with an ESP32. I know basic Arduino."></textarea><div class="examples" aria-label="Example goals">${['Build an ESP32 weather station','Bake my first sourdough','Learn Python with a todo CLI'].map(x=>`<button type="button" data-example="${esc(x)}">${esc(x)}</button>`).join('')}</div><fieldset class="levels"><legend>Where are you starting?</legend>${['Complete beginner','Some experience','Experienced, filling gaps'].map((x,i)=>`<label><input type="radio" name="level" value="${esc(x)}" ${i?'':'checked'}>${esc(x)}</label>`).join('')}</fieldset><button class="btn">Build my roadmap ${icon('arrow')}</button><div id="building" hidden></div></form></div>`}
async function library(){const v=routeVersion;const [list,cfg]=await Promise.all([api('GET','courses'),api('GET','settings')]);if(v!==routeVersion)return;libraryData=list;libraryCfg=cfg;renderLibrary()}
function renderLibrary(){app.innerHTML=`<div class="wrap narrow">${!libraryData.length?creationForm(true):`<div class="intro"><div><div class="kicker">${libraryData.length} roadmaps · one next step</div><h1>Pick up the trail.</h1><p>Your projects, your pace. Every stop is something you can do.</p></div><button id="add-roadmap" class="btn">${icon('plus')} Add roadmap</button></div><div class="cards">${libraryData.map((c,i)=>`<section class="card"><div class="card-head"><div class="row between"><span class="kicker">Route ${String(i+1).padStart(2,'0')}</span>${c.total&&c.done===c.total?'<span class="tag">Roadmap complete</span>':''}</div><h2><a href="${href(c.id)}">${esc(c.title)}</a></h2></div><div class="card-foot"><div>${miniRoute(c.done,c.total)}<b class="small">${c.done} of ${c.total} lessons complete</b></div><button class="link" data-del="${esc(c.id)}" data-title="${esc(c.title)}">Delete</button><p>${esc(c.summary)}</p></div></section>`).join('')}</div><p class="library-caption">${icon('Do it yourself')} Made for learning by doing. Start small. Keep going.</p>`}</div>`}
function showCreation(){app.innerHTML=`<div class="wrap narrow">${creationForm()}</div>`;$('#prompt').focus()}
async function create(form){if(building)return;building=true;const prompt=$('#prompt').value,level=form.querySelector('[name=level]:checked').value,panel=$('#building'),v=routeVersion;for(const child of form.children)child.hidden=child!==panel;panel.className='loading';panel.innerHTML=`${loadingArt()}<h2>Designing your roadmap</h2><p>The AI is deciding how to get from your starting point to your goal. This can take a minute or more.</p><div class="build-stages"><div><span class="step-number">1</span><strong>Design the phases and lessons</strong></div><div class="muted"><span class="step-number">2</span><span>Search videos for every lesson in the background</span></div></div><p class="small" style="margin-top:24px">Your roadmap opens as soon as the design is ready. Videos may arrive a little later.</p>`;try{const c=normalize(await api('POST','courses',{prompt,level}));if(v===routeVersion){course=c;location.hash=href(c.id)}}catch(e){if(v===routeVersion){toast(e.message);for(const child of form.children)child.hidden=child===panel}}finally{building=false}}
function nextLesson(){const last=find(S().last);return last&&!S().done[last.id]?last:all().find(l=>!S().done[l.id])||all()[0]}
function overview(){cur=null;const ls=all(),n=ls.filter(l=>S().done[l.id]).length,next=nextLesson(),complete=ls.length&&n===ls.length;app.innerHTML=`<div class="wrap"><div class="overview-head"><div><a class="back-map" href="#/">${icon('back')} Your roadmaps</a><h1>${esc(course.title)}</h1><p class="goal">${esc(course.summary)}</p>${complete?`<div class="celebrate"><strong>Roadmap complete.</strong><p>You reached every stop. Take what you learned and make something of your own.</p><a class="btn" href="${href(course.id,ls[0].id)}">Revisit the route ${icon('arrow')}</a></div>`:next?`<p class="continue-title">Next stop: ${esc(next.title)}</p><a class="btn" href="${href(course.id,next.id)}">${n?'Continue learning':'Start the first lesson'} ${icon('arrow')}</a>`:''}</div><div class="progress-board"><span>Your progress</span><strong>${ls.length?Math.round(n/ls.length*100):0}%</strong><span>${n} of ${ls.length} lessons complete</span><span class="bar"><i style="width:${ls.length?n/ls.length*100:0}%"></i></span></div></div><div id="video-status"></div><section class="route-board"><div class="route-heading"><h2>The route ahead</h2><span class="small">${course.phases.length} phase milestones</span></div>${course.phases.map((p,pi)=>`<section class="route-phase"><div class="phase-flag"><span class="flag">${icon('flag')} Phase ${pi+1}</span><h3>${esc(p.title)}</h3><p>${esc(p.blurb)}</p><b class="small">${p.lessons.filter(l=>S().done[l.id]).length} / ${p.lessons.length} stops${p.lessons.every(l=>S().done[l.id])?' · Milestone reached':''}</b></div><div class="route-stops"><svg class="route-line" viewBox="0 0 100 ${p.lessons.length*88}" preserveAspectRatio="none" aria-hidden="true"><path d="${p.lessons.map((l,i)=>i?`C${i%2?50:83} ${i*88} ${i%2?83:50} ${i*88} ${i%2?83:50} ${i*88+44}`:'M50 44').join(' ')}"/></svg>${p.lessons.map((l,i)=>`<a class="route-stop ${status(l)} ${next===l&&!complete?'here':''}" href="${href(course.id,l.id)}"><span class="stop">${S().done[l.id]?icon('Done when'):i+1}</span><span>${next===l&&!complete?'<span class="here-label">YOU ARE HERE</span>':''}<span class="stop-title">${esc(l.title)}</span><span class="stop-meta" style="display:block">${esc(l.id)} · ${S().done[l.id]?'Complete':status(l)==='part'?'In progress':'Ready when you are'}</span></span>${S().done[l.id]?'<span class="tag">Done</span>':''}</a>`).join('')}</div></section>`).join('')}</section></div>`;drawRoutes();renderTop();updateVideoStatus();watchVideoSearch()}
// Measure actual stop positions so long titles and tall phase descriptions keep the road aligned.
function drawRoutes(){document.querySelectorAll('.route-stops').forEach(board=>{const svg=board.querySelector('svg'),box=board.getBoundingClientRect(),points=[...board.querySelectorAll('.stop')].map(el=>{const r=el.getBoundingClientRect();return {x:(r.left+r.width/2-box.left)/(box.width*.3)*100,y:r.top+r.height/2-box.top}});svg.style.top='0';svg.style.height=box.height+'px';svg.setAttribute('viewBox','0 0 100 '+box.height);svg.querySelector('path').setAttribute('d',points.map((p,i)=>i?`C${points[i-1].x} ${(points[i-1].y+p.y)/2} ${p.x} ${(points[i-1].y+p.y)/2} ${p.x} ${p.y}`:`M${p.x} ${p.y}`).join(' '))})}
addEventListener('resize',drawRoutes);

function updateVideoStatus(){const el=$('#video-status');if(!el)return;const pending=all().filter(l=>!l.videos).length;el.innerHTML=pending?`<p class="video-status">${icon('Watch')} Videos may still be arriving for ${pending} of ${all().length} lessons. Open any lesson to search again if needed.</p>`:''}
// Refresh only video metadata: never replace local progress with an older server snapshot.
function watchVideoSearch(attempt=0){clearTimeout(videoTimer);if(attempt>=12)return;if(!course||!all().some(l=>!l.videos))return;const c=course;videoTimer=setTimeout(async()=>{try{const fresh=await api('GET','courses/'+enc(c.id));if(course!==c)return;const byId=new Map(fresh.phases.flatMap(p=>p.lessons).map(l=>[l.id,l]));all().forEach(l=>{if(byId.get(l.id)?.videos)l.videos=byId.get(l.id).videos});updateVideoStatus()}catch(e){}if(course===c&&!cur)watchVideoSearch(attempt+1)},3500)}
function lessonSteps(){return [{id:'watch',title:'Watch'},{id:'learn',title:'Learn first'},...(cur.lookups?.length?[{id:'lookup',title:'Look it up yourself'}]:[]),{id:'do',title:'Do it yourself'},{id:'practice',title:'Practise'},{id:'done',title:'Done when'}]}
function renderRail(){const el=$('#lesson-rail');if(!el)return;const pn=course.phases.findIndex(p=>p.lessons.includes(cur)),ls=all(),i=ls.indexOf(cur);el.innerHTML=`<div class="rail-map"><a class="back-map" href="${href(course.id)}">${icon('back')} Full roadmap</a>${miniRoute(ls.filter(l=>S().done[l.id]).length,ls.length,i)}<p>Stop ${i+1} of ${ls.length} · Phase ${pn+1}</p></div><nav class="lesson-steps" aria-label="Lesson steps">${lessonSteps().map((s,i)=>`<button data-step="${s.id}" ${activeStep===s.id?'aria-current="step"':''} class="${visited[chatKey()]?.has(s.id)?'visited':''}"><span class="step-number">${i+1}</span>${esc(s.title)}</button>`).join('')}</nav>`}
function lesson(lid){const l=find(lid);if(!l){location.hash=href(course.id);return}cur=l;activeStep='watch';if(S().last!==lid){S().last=lid;save()}const pn=course.phases.findIndex(p=>p.lessons.includes(l)),ls=all(),i=ls.indexOf(l);app.innerHTML=`<div class="lesson-layout"><div class="lesson-rail" id="lesson-rail"></div><article class="lesson-article"><div class="kicker">Phase ${pn+1} / ${esc(course.phases[pn].title)}</div><h1 class="lesson-title">${esc(l.title)}</h1><p class="goal">${fmt(l.goal)}</p><span id="completed" class="tag" hidden>Lesson complete</span><div id="lesson-content" class="lesson-content"></div><nav class="pager" aria-label="Lessons">${i?`<a href="${href(course.id,ls[i-1].id)}">Previous: ${esc(ls[i-1].title)}</a>`:'<span></span>'}${ls[i+1]?`<a href="${href(course.id,ls[i+1].id)}">Next: ${esc(ls[i+1].title)}</a>`:`<a href="${href(course.id)}">Back to roadmap</a>`}</nav></article><aside class="support" aria-label="Learning tools"><section class="panel tutor-panel"><h2>${icon('Tutor')} Tutor</h2><div id="log" class="log" aria-live="polite" aria-relevant="additions text"></div><div class="chips">${CHIPS.map(c=>`<button type="button" class="chip" data-ask="${esc(c)}" title="${esc(c)}" aria-label="${esc(c)}">${icon(c)}${esc({'Give me a hint':'Hint','Quiz me':'Quiz me','Explain a concept':'Explain','Review my work':'Review'}[c])}</button>`).join('')}</div><form id="compose"><label class="sr" for="msg">Message the tutor</label><textarea id="msg" rows="2" placeholder="Where are you stuck?"></textarea><button class="btn">Send ${icon('arrow')}</button></form></section><section class="panel notes-panel"><h2><label for="notes">${icon('My notes')} My notes</label></h2><textarea id="notes" rows="5" placeholder="What worked? What would you try next?">${esc(S().notes[l.id]||'')}</textarea><p class="small" style="margin:8px 0 0">Saved with this lesson.</p></section></aside></div>`;showStep('watch');renderLog();renderTop();scrollTo(0,0)}
function list(items){return `<ol class="content-list">${(items||[]).map(x=>`<li>${fmt(x)}</li>`).join('')}</ol>`}
function showStep(id,focus=false){activeStep=id;(visited[chatKey()] ||= new Set()).add(id);renderRail();const steps=lessonSteps(),i=steps.findIndex(s=>s.id===id),s=steps[i];let body='';if(id==='watch')body='<div id="videos"><div class="loading" role="status">Finding free lessons on YouTube…</div></div>';if(id==='learn')body=`<p class="muted">Get comfortable with these ideas before you start making.</p>${list(cur.concepts)}`;if(id==='lookup')body=`<p>These searches are <strong>your job</strong>. Open each phrase in your browser, compare what you find, and keep useful discoveries in your notes.</p>${cur.lookups.map((x,i)=>`<div class="lookup"><a href="https://duckduckgo.com/?q=${enc(x)}">${icon('Look it up yourself')} ${esc(x)}</a><button class="btn secondary" data-copy="${i}" aria-label="Copy search phrase ${i+1}">${icon('copy')} Copy</button></div>`).join('')}`;if(id==='do')body=`${cur.warn?`<div class="note"><strong>${icon('Safety')} Before you begin</strong><p style="margin:8px 0 0">${fmt(cur.warn)}</p></div>`:''}<p class="muted">Try it yourself first. Ask the tutor for a hint when you need one.</p>${list(cur.tasks)}`;if(id==='practice')body='<div id="practice"></div>';if(id==='done')body=`<p class="muted">Check each one when you can honestly say it’s true.</p><div class="checks">${(cur.done||[]).map((x,k)=>`<label><input type="checkbox" data-check="${k}" ${S().checks[cur.id+'#'+k]?'checked':''}><span>${fmt(x)}</span></label>`).join('')}</div><div class="finish"><button id="finish" class="btn"></button><div id="fstate" role="status"></div></div>`;$('#lesson-content').innerHTML=`<div class="step-heading"><h2 id="step-title" tabindex="-1">${icon(s.title)} ${esc(s.title)}</h2><span class="small">${i+1} / ${steps.length}</span></div><div class="step-body">${body}</div><div class="step-footer">${i?`<button class="link" data-step="${steps[i-1].id}">Back</button>`:'<span class="small">Take your time.</span>'}${i<steps.length-1?`<button class="btn secondary" data-step="${steps[i+1].id}">Next: ${esc(steps[i+1].title)} ${icon('arrow')}</button>`:`<a href="${href(course.id)}" class="small">See the full route</a>`}</div>`;$('#completed').hidden=!S().done[cur.id];if(id==='watch')loadVideos(cur,course);if(id==='done')finishUI();if(id==='practice')renderPractice();if(focus){$('#step-title').focus({preventScroll:true});$('#lesson-content').scrollIntoView({block:'start'})}}
function finishUI(){if(!cur)return;const done=!!S().done[cur.id];if($('#completed'))$('#completed').hidden=!done;if(!$('#finish'))return;const ok=checked(cur).every(Boolean);$('#finish').textContent=done?'Completed. Undo':'Mark lesson complete';$('#finish').disabled=!done&&!ok;$('#fstate').className='small';$('#fstate').textContent=done?'You reached this stop.':ok?'Ready for the next stop.':'Tick every check to unlock completion.'}
async function loadVideos(l,c){const more=`<p class="small"><a href="https://www.youtube.com/results?search_query=${enc(l.query)}">Search YouTube for this lesson</a></p>`;try{if(!l.videos?.length)l.videos=await api('POST','courses/'+enc(c.id)+'/videos',{lesson:l.id})}catch(e){if(cur===l&&activeStep==='watch')$('#videos').innerHTML=`<p class="err">${esc(e.message)}</p><button class="btn secondary" id="retry-videos">Try again</button>${more}`;return}if(cur!==l||activeStep!=='watch')return;if(l.videos.length)showVideo(0);else $('#videos').innerHTML='<p>No videos found yet.</p>'+more}
function showVideo(k){const l=cur,v=l.videos[k];if(!v)return;$('#videos').innerHTML=`<div class="player" id="player"><div class="player-placeholder">${icon('Watch')}<strong>${esc(v.title)}</strong><span class="small" style="color:inherit">YouTube · ${esc(v.channel)}</span><button class="btn" id="play-video" data-index="${k}">${icon('Watch')} Play video</button></div></div><div class="vlist">${l.videos.map((x,j)=>`<button class="vid" data-video="${j}" aria-pressed="${j===k}"><span class="video-number">${String(j+1).padStart(2,'0')}</span><span><b>${esc(x.title)}</b><small>${esc(x.channel)}${x.duration?' · '+Math.floor(x.duration/60)+' min':''}</small></span>${j===k?icon('Watch'):''}</button>`).join('')}</div><p class="small" style="margin-bottom:0">Video won’t play? <a href="https://www.youtube.com/watch?v=${enc(v.id)}">Open it on YouTube</a> · <a href="https://www.youtube.com/results?search_query=${enc(l.query)}">More results</a></p>`}
function playVideo(k){const v=cur.videos[k];$('#player').innerHTML=`<iframe src="https://www.youtube.com/embed/${enc(v.id)}?autoplay=1" title="${esc(v.title)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>`}
function renderLog(){if(!cur||!$('#log'))return;const msgs=chats[chatKey()]||[];$('#log').innerHTML=(msgs.length?msgs.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.content):fmtTutor(m.content)}</div>`).join(''):'<p class="muted">A nudge, not the answer. Bring a question, a rough idea, or an attempt you’d like to improve.</p>')+(busyKey===chatKey()?`<div class="msg a thinking" role="status">${icon('Tutor')} Tutor is thinking…</div>`:'');$('#log').scrollTop=$('#log').scrollHeight;$('#compose button').disabled=!!busyKey}
async function ask(text){text=text.trim();if(!text||busyKey||!cur)return;const l=cur,c=course,key=chatKey(),msgs=chats[key] ||= [];msgs.push({role:'user',content:text});busyKey=key;$('#msg').value='';renderLog();try{const r=await api('POST','chat',{course:c.id,lesson:l.id,messages:msgs});msgs.push({role:'assistant',content:r.text||'(No answer.)'})}catch(e){msgs.pop();toast(e.message);if(cur===l)$('#msg').value=text}finally{busyKey=null;renderLog()}}
async function loadPractice(fresh=false){const c=course,l=cur,key=chatKey();if(practiceBusy[key])return;practiceBusy[key]=true;practiceFresh[key]=fresh;delete practiceErrors[key];renderPractice();try{const p=await api('POST','courses/'+enc(c.id)+'/practice',{lesson:l.id,...(fresh?{fresh:true}:{})});l.practice=p;delete sessions[key];practiceViews[key]='quiz';if(fresh){delete c.state.quiz[l.id];if(c===course)save();else await api('PUT','courses/'+enc(c.id)+'/state',c.state)}}catch(e){practiceErrors[key]=e.message}finally{delete practiceBusy[key];if(cur===l&&activeStep==='practice')renderPractice()}}
function renderPractice(){const el=$('#practice');if(!el||!cur)return;const key=chatKey(),p=cur.practice;if(practiceBusy[key]){el.innerHTML=`<div class="loading" role="status">${loadingArt()}<h3>Preparing your practice.</h3><p>The AI is writing questions${/python|code|program|javascript/i.test(course.prompt||'')?' and an exercise':''} for this lesson. This often takes many seconds.</p><span class="small">Your notes and tutor are still available.</span></div>`;return}if(practiceErrors[key]){el.innerHTML=`<div class="err" role="alert"><strong>Practice couldn’t load.</strong><p>${esc(practiceErrors[key])}</p><button id="retry-practice" class="btn secondary">Try again</button></div>`;return}if(!p){el.innerHTML=`<div class="practice-start"><h3>Put it to the test.</h3><p>A few questions to check what stuck. No rush, and no penalty for getting it wrong.</p><button class="btn" id="load-practice">Get practice ${icon('arrow')}</button><p class="small" style="margin:16px 0 0">Created for this lesson. It can take a little while.</p></div>`;return}let qhtml='',session=sessions[key];if(!session&&S().quiz[cur.id])session=sessions[key]={finished:true,...S().quiz[cur.id]};if(!session)session=sessions[key]={index:0,score:0,selected:null,finished:false};const quiz=p.quiz||[];if(session.finished){qhtml=`<div class="score" tabindex="-1"><strong>${session.score} / ${session.total??quiz.length}</strong><h3>Practice makes progress.</h3><p>${session.score===(session.total??quiz.length)?'You’ve got a good handle on these ideas. Put them to work.':'Revisit what felt uncertain, then have another go.'}</p><div class="row"><button class="btn" id="quiz-again">Try again</button><button class="btn secondary" id="fresh-practice">New questions</button></div></div>`}else if(quiz.length){const q=quiz[session.index];qhtml=`<div class="quiz-meta"><span>Question ${session.index+1} of ${quiz.length}</span><span>${session.score} correct so far</span></div><h3 class="question" id="question" tabindex="-1">${fmt(q.q)}</h3><div class="options">${q.options.map((x,i)=>`<button class="option ${session.selected!==null?(i===q.answer?'correct':i===session.selected?'wrong':''):''}" data-answer="${i}" ${session.selected!==null?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('')}</div>${session.selected!==null?`<div class="feedback" role="status"><strong>${session.selected===q.answer?'That’s right.':'Not quite. The answer is '+esc(q.options[q.answer])+'.'}</strong><p>${fmt(q.why)}</p><button class="btn" id="quiz-next">${session.index===quiz.length-1?'See my score':'Next question'} ${icon('arrow')}</button></div>`:''}`}else qhtml='<p>No questions were returned for this lesson.</p><button class="btn secondary" id="fresh-practice">New questions</button>';const view=practiceViews[key]||'quiz';el.innerHTML=(p.exercise?`<div class="practice-nav" role="group" aria-label="Practice activities"><button data-practice-view="quiz" aria-pressed="${view==='quiz'}">Quiz${S().quiz[cur.id]?' · '+S().quiz[cur.id].score+'/'+S().quiz[cur.id].total:''}</button><button data-practice-view="code" aria-pressed="${view==='code'}">Code exercise</button></div>`:'')+(p.exercise&&view==='code'?renderExercise(p.exercise):qhtml)}
function renderExercise(ex){const code=S().code[cur.id]??ex.starter,run=runStates[chatKey()];return `<section class="exercise"><div class="kicker">${icon('Practise')} Make it work · ${esc(ex.lang)}</div><h3>${esc(ex.title)}</h3><p>${fmt(ex.prompt)}</p><div class="code-label"><label for="code">Your code</label><span>Tab = 4 spaces</span></div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off">${esc(code)}</textarea><div class="row run-actions"><button class="btn" id="run-code" ${run?.running?'disabled':''}>${icon('Watch')} Run</button><button class="btn secondary" id="run-tests" ${run?.running?'disabled':''}>${icon('Done when')} Run tests</button><button class="link" id="reset-code" ${run?.running?'disabled':''}>Reset to starter</button></div><div class="output ${run&&!run.running&&!run.error?(run.ok?'passed':'failed'):''}"><div class="output-header" role="status">${run?.running?(run.test?'Running tests…':'Running code…'):run?.error?'Run couldn’t finish':run?run.test?(run.ok?'Tests passed':'Tests failed'):(run.ok?'Run finished':'Run failed'):'Output'}</div><pre id="output">${esc(run?.running?'Sandbox time limit: 10 seconds.':run?.output??'Run your code to see the result here.')}</pre></div><details><summary>View the tests</summary><pre>${esc(ex.tests)}</pre></details></section>`}
function answer(i){const s=sessions[chatKey()],q=cur.practice.quiz[s.index];if(s.finished||s.selected!==null||!Number.isInteger(i)||i<0||i>=q.options.length)return;s.selected=i;if(i===q.answer)s.score++;renderPractice();$('#quiz-next')?.focus({preventScroll:true})}
function quizNext(){const s=sessions[chatKey()];if(s.selected===null)return;if(s.index===cur.practice.quiz.length-1){s.finished=true;s.total=cur.practice.quiz.length;S().quiz[cur.id]={score:s.score,total:s.total};save()}else{s.index++;s.selected=null}renderPractice();($('#question')||$('.score'))?.focus({preventScroll:true})}
async function runCode(test){const c=course,l=cur,key=chatKey();if(runStates[key]?.running)return;const code=$('#code').value;S().code[l.id]=code;save();runStates[key]={running:true,test};renderPractice();try{const r=await api('POST','run',{course:c.id,lesson:l.id,code,test});runStates[key]={...r,test}}catch(e){runStates[key]={error:true,output:e.message,test}}if(cur===l&&activeStep==='practice')renderPractice()}
const BASES={gemini:['https:','','generativelanguage.googleapis.com','v1beta','openai'].join('/'),openrouter:['https:','','openrouter.ai','api','v1'].join('/'),ollama:['http:','','localhost:11434','v1'].join('/')};
async function settings(){const v=routeVersion,c=await api('GET','settings');if(v!==routeVersion)return;app.innerHTML=`<div class="wrap narrow"><div class="intro"><h1>Settings</h1><a href="#/">Back to roadmaps</a></div><div class="settings-layout"><div><h3>Choose your engine.</h3><p class="muted">Connect an OpenAI-compatible AI service. Your key stays on this computer.</p><p class="small">Roadmap uses it to plan lessons, prepare practice, and give you hints.</p></div><form id="settings"><label for="base">Base URL</label><input type="url" id="base" required value="${esc(c.base)}" placeholder="Your service’s API base URL"><p class="small" style="margin:12px 0 0">Quick fill</p><div class="examples">${[['gemini','Google Gemini'],['openrouter','OpenRouter'],['ollama','Ollama on this computer']].map(([k,n])=>`<button type="button" data-base="${k}">${n}</button>`).join('')}</div><label for="model">Model name</label><input id="model" required value="${esc(c.model)}"><label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="${c.key_set?'Saved. Leave empty to keep it.':'Not needed for a local Ollama model'}"><p class="save row"><button class="btn">Save settings</button><span id="saved" role="status"></span></p></form></div></div>`}
async function route(){const v=++routeVersion;clearTimeout(videoTimer);cur=null;if(saveFn){clearTimeout(saveT);await saveFn()}if(v!==routeVersion)return;const [,a,rawId,rawLid]=location.hash.split('/');app.innerHTML='<div class="wrap narrow loading" role="status">Opening your roadmap…</div>';try{if(a==='c'&&rawId){const id=decodeURIComponent(rawId);if(!course||course.id!==id){const c=await api('GET','courses/'+enc(id));if(v!==routeVersion)return;course=normalize(c)}renderTop();return rawLid?lesson(decodeURIComponent(rawLid)):overview()}course=null;renderTop();await(a==='settings'?settings():library())}catch(e){if(v!==routeVersion)return;course=null;renderTop();app.innerHTML=`<div class="wrap narrow"><p class="err">${esc(e.message)}</p><a href="#/">Back to your roadmaps</a></div>`}}
document.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='new')create(e.target);else if(e.target.id==='compose')ask($('#msg').value);else if(e.target.id==='settings'){const button=e.target.querySelector('button.btn');button.disabled=true;try{await api('PUT','settings',{base:$('#base').value,model:$('#model').value,key:$('#key').value});if($('#key')){$('#key').value='';$('#saved').textContent='Settings saved.'}}catch(err){toast(err.message)}finally{button.disabled=false}}});
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||t.disabled)return;if(t.dataset.base){$('#base').value=BASES[t.dataset.base];return}if(t.dataset.example){$('#prompt').value=t.dataset.example;$('#prompt').focus();return}if(t.id==='add-roadmap')showCreation();else if(t.id==='cancel-new')renderLibrary();else if(t.dataset.del){if(!confirm(`Delete "${t.dataset.title}" and all its progress? This can't be undone.`))return;try{await api('DELETE','courses/'+enc(t.dataset.del));await library()}catch(err){toast(err.message)}}else if(t.dataset.practiceView){practiceViews[chatKey()]=t.dataset.practiceView;renderPractice();document.querySelector('[data-practice-view='+t.dataset.practiceView+']').focus({preventScroll:true})}else if(t.dataset.step)showStep(t.dataset.step,true);else if(t.dataset.video!==undefined)showVideo(+t.dataset.video);else if(t.id==='play-video')playVideo(+t.dataset.index);else if(t.id==='retry-videos')loadVideos(cur,course);else if(t.dataset.ask)ask(t.dataset.ask);else if(t.dataset.copy!==undefined){const phrase=cur.lookups[+t.dataset.copy];try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(phrase);else{const input=document.createElement('textarea');input.value=phrase;input.style.position='fixed';input.style.top='-1000px';document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();t.focus();if(!ok)throw Error('Copy unavailable')}toast('Search phrase copied.')}catch(err){toast('Copy unavailable. Select the phrase and copy it with Ctrl+C.')}}else if(t.id==='load-practice'||t.id==='retry-practice')loadPractice(t.id==='retry-practice'&&!!practiceFresh[chatKey()]);else if(t.id==='fresh-practice')loadPractice(true);else if(t.id==='quiz-again'){delete sessions[chatKey()];delete S().quiz[cur.id];save();renderPractice();$('#question')?.focus({preventScroll:true})}else if(t.dataset.answer!==undefined)answer(+t.dataset.answer);else if(t.id==='quiz-next')quizNext();else if(t.id==='run-code')runCode(false);else if(t.id==='run-tests')runCode(true);else if(t.id==='reset-code'){if(confirm('Replace your code with the starter? Your edits will be lost.')){S().code[cur.id]=cur.practice.exercise.starter;delete runStates[chatKey()];save();renderPractice()}}else if(t.id==='finish'){if(S().done[cur.id])delete S().done[cur.id];else if(checked(cur).every(Boolean))S().done[cur.id]=true;else return;save();finishUI();renderRail();if(S().done[cur.id]){const next=all()[all().indexOf(cur)+1],phase=course.phases.find(p=>p.lessons.includes(cur)),achievement=all().every(l=>S().done[l.id])?'Roadmap complete':phase.lessons.every(l=>S().done[l.id])?'Phase milestone reached':'Lesson complete';$('#fstate').className='celebrate';$('#fstate').innerHTML=`<strong>${achievement}</strong><p>One more stop behind you. Keep that momentum.</p>${next?`<a class="btn" href="${href(course.id,next.id)}">Next lesson ${icon('arrow')}</a>`:`<a class="btn" href="${href(course.id)}">See your completed route</a>`}`;const burst=document.createElement('div');burst.className='burst';burst.innerHTML=Array.from({length:24},(_,i)=>`<i style="--x:${(i-12)*28}px;--r:${i*37}deg"></i>`).join('');document.body.append(burst);setTimeout(()=>burst.remove(),1100)}}});
document.addEventListener('change',e=>{const k=e.target.dataset.check;if(k===undefined||!cur)return;if(e.target.checked)S().checks[cur.id+'#'+k]=true;else delete S().checks[cur.id+'#'+k];save();finishUI()});
document.addEventListener('input',e=>{if(!cur)return;if(e.target.id==='notes'){S().notes[cur.id]=e.target.value;save()}else if(e.target.id==='code'){S().code[cur.id]=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.target.id==='msg'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.target.value)}if(e.target.id==='code'&&e.key==='Tab'&&!e.shiftKey){e.preventDefault();const el=e.target,start=el.selectionStart;el.setRangeText('    ',start,el.selectionEnd,'end');S().code[cur.id]=el.value;save()}});
addEventListener('hashchange',route);route();
