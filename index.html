<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const fmtTutor = s => String(s).split('```').map((p,i)=>i%2?'<pre>'+esc(p.replace(/^[a-z]*\n/,''))+'</pre>':fmt(p).replace(/\n/g,'<br>')).join('');
const enc = s => encodeURIComponent(s).replace(/'/g,'%27');
const href = (c,l) => '#/c/'+enc(c)+(l?'/'+enc(l):'');
const ICONS={Watch:'<path d="m8 4 12 8-12 8z"/>','Learn first':'<path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.5c1 1 1 2 1 3.5h6c0-1.5 0-2.5 1-3.5A6 6 0 0 0 12 2z"/>','Look it up yourself':'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>','Read the code':'<path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/>','Do it yourself':'<path d="M14 5a4 4 0 0 0 5 5l-9 10-5-1-1-4zM4 4l5 5"/>',Practise:'<path d="M4 5h16v14H4zM8 9l2 2-2 2M12 14h4"/>','Done when':'<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>',Tutor:'<path d="M3 4h18v13H9l-5 4v-4H3zM8 10h1m6 0h1"/>','My notes':'<path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/>','Give me a hint':'<path d="M12 3a6 6 0 0 0-4 10l1 4h6l1-4a6 6 0 0 0-4-10zM9 21h6"/>','Quiz me':'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2m0 3v.1"/>','Explain a concept':'<path d="M3 4q5-2 9 1 4-3 9-1v15q-5-2-9 1-4-3-9-1zM12 5v15"/>','Review my work':'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10l2 2 3-4"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="1"/><path d="M16 8V3H3v13h5"/>',flag:'<path d="M5 22V3h14l-3 5 3 5H5"/>',Safety:'<path d="m12 3 10 18H2zM12 9v5m0 3v1"/>'};
const icon = n => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.arrow}</svg>`;

const checked=l=>(l.done||[]).map((_,k)=>!!S().checks[l.id+'#'+k]);
const status=l=>S().done[l.id]?'done':checked(l).some(Boolean)?'part':'';
function normalize(c){c.state ||= {};for(const k of ['checks','done','notes','quiz','code'])c.state[k] ||= {};c.state.last ||= '';return c}
async function api(method,path,body){const r=await fetch('api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(d.error||'Request failed ('+r.status+')'),{status:r.status});return d}
function toast(m){$('#toast').textContent=m;$('#toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').hidden=true,9000)}
// Keep one pending state snapshot; routing flushes it before replacing the page.
function save(){const c=course;clearTimeout(saveT);saveFn=()=>{saveFn=null;return api('PUT','courses/'+enc(c.id)+'/state',c.state).catch(e=>toast("Couldn't save your progress: "+e.message))};saveT=setTimeout(saveFn,400);renderTop()}
function renderTop(){ $('#meter').hidden=$('#ctitle').hidden=!course;$('#switcher').hidden=!course;if(!course)return;const ls=all(),n=ls.filter(l=>S().done[l.id]).length;$('#ctitle').textContent=course.title;$('#ctitle').href=href(course.id);$('#count').textContent=n+' / '+ls.length;$('#bar').style.width=(ls.length?n/ls.length*100:0)+'%'}
function miniRoute(n,total,current=null){const count=Math.max(2,Math.min(total||2,7)),points=Array.from({length:count},(_,i)=>({x:8+i*244/(count-1),y:i%2?12:27})),d=points.map((p,i)=>i?`C${(points[i-1].x+p.x)/2} ${points[i-1].y} ${(points[i-1].x+p.x)/2} ${p.y} ${p.x} ${p.y}`:`M${p.x} ${p.y}`).join(' '),done=Math.round(n/(total||1)*count);return `<svg class="mini-route" viewBox="0 0 260 40" role="img" aria-label="${n} of ${total} lessons complete"><path d="${d}"/>${points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="6" class="${i===(current===null?done:Math.min(count-1,Math.round(current/Math.max(1,total-1)*(count-1))))?'here':i<done?'done':''}"/>`).join('')}</svg>`}

function creationForm(empty=false){return `<div class="intro"><div><div class="kicker">${icon('flag')} Your next adventure</div><h1>Add roadmap</h1><p>Build something of your own, or find your way around a project you already have.</p></div>${!empty?'<button class="btn secondary" id="cancel-new" type="button">Back to library</button>':''}</div>${libraryCfg.base&&libraryCfg.model?'':'<p class="note">Connect an AI service in <a href="#/settings">Settings</a> before building your roadmap.</p>'}<div class="creation"><div class="creation-story"><h2>A goal.<br> A route.<br> Your own work.</h2>${loadingArt()}<p>Free videos, things to try, and a tutor for the moments you get stuck.</p></div><form id="new"><fieldset class="kind-choice"><legend>What kind of roadmap?</legend><label><input type="radio" name="kind" value="build" checked><span>Build something new</span></label><label><input type="radio" name="kind" value="project"><span>Understand an existing project</span></label></fieldset><div id="project-fields" hidden><button class="btn secondary" type="button" id="pick-folder">Choose folder</button><p class="folder-path" id="folder-path" role="status">No folder selected.</p><div class="note privacy"><strong>Before you share this project</strong><p>Roadmap reads text files in this folder and sends part of them to the AI service configured in <a href="#/settings">Settings</a>. Hidden files, dependency folders and files that look like secrets or keys are skipped.</p><p>A local model keeps the code on this computer.</p></div></div><label for="prompt" id="prompt-label">I want to…</label><textarea id="prompt" rows="3" required placeholder="Build a weather station with an ESP32. I know basic Arduino."></textarea><div class="examples" id="goal-examples" aria-label="Example goals">${['Build an ESP32 weather station','Bake my first sourdough','Learn Python with a todo CLI'].map(x=>`<button type="button" data-example="${esc(x)}">${esc(x)}</button>`).join('')}</div><fieldset class="lev function drawRoutes(){document.querySelectorAll('.route-stops').forEach(board=>{const svg=board.querySelector('svg'),box=board.getBoundingClientRect(),points=[...board.querySelectorAll('.stop')].map(el=>{const r=el.getBoundingClientRect();return {x:(r.left+r.width/2-box.left)/(box.width*.3)*100,y:r.top+r.height/2-box.top}});svg.style.top='0';svg.style.height=box.height+'px';svg.setAttribute('viewBox','0 0 100 '+box.height);svg.querySelector('path').setAttribute('d',points.map((p,i)=>i?`C${points[i-1].x} ${(points[i-1].y+p.y)/2} ${p.x} ${(points[i-1].y+p.y)/2} ${p.x} ${p.y}`:`M${p.x} ${p.y}`).join(' '))})}

function renderPractice(){const el=$('#practice');if(!el||!cur)return;const key=chatKey(),p=cur.practice;if(practiceBusy[key]){el.innerHTML=`<div class="loading" role="status">${loadingArt()}<h3>Preparing your practice.</h3><p>The AI is writing questions${/python|code|program|javascript/i.test(course.prompt||'')?' and an exercise':''} for this lesson. This often takes many seconds.</p><span class="small">Your notes and tutor are still available.</span></div>`;return}if(practiceErrors[key]){el.innerHTML=`<div class="err" role="alert"><strong>Practice couldn’t load.</strong><p>${esc(practiceErrors[key])}</p><button id="retry-practice" class="btn secondary">Try again</button></div>`;return}if(!p){el.innerHTML=`<div class="practice-start"><h3>Put it to the test.</h3><p>A few questions to check what stuck. No rush, and no penalty for getting it wrong.</p><button class="btn" id="load-practice">Get practice ${icon('arrow')}</button><p class="small" style="margin:16px 0 0">Created for this lesson. It can take a little while.</p></div>`;return}let qhtml='',session=sessions[key];if(!session&&S().quiz[cur.id])session=sessions[key]={finished:true,...S().quiz[cur.id]};if(!session)session=sessions[key]={index:0,score:0,selected:null,finished:false};const quiz=p.quiz||[];if(session.finished){qhtml=`<div class="score" tabindex="-1"><strong>${session.score} / ${session.total??quiz.length}</strong><h3>Practice makes progress.</h3><p>${session.score===(session.total??quiz.length)?'You’ve got a good handle on these ideas. Put them to work.':'Revisit what felt uncertain, then have another go.'}</p><div class="row"><button class="btn" id="quiz-again">Try again</button><button class="btn secondary" id="fresh-practice">New questions</button></div></div>`}else if(quiz.length){const q=quiz[session.index];qhtml=quizQuestion(q,session,quiz.length)}else qhtml='<p>No questions were returned for this lesson.</p><button class="btn secondary" id="fresh-practice">New questions</button>';const view=practiceViews[key]||'quiz';el.innerHTML=(p.exercise?`<div class="practice-nav" role="group" aria-label="Practice activities"><button data-practice-view="quiz" aria-pressed="${view==='quiz'}">Quiz${S().quiz[cur.id]?' · '+S().quiz[cur.id].score+'/'+S().quiz[cur.id].total:''}</button><button data-practice-view="code" aria-pressed="${view==='code'}">Code exercise</button></div>`:'')+(p.exercise&&view==='code'?renderExercise(p.exercise):qhtml)}

function quizQuestion(q,session,total,review=false){return `<div class="quiz-meta"><span>Question ${session.index+1} of ${total}</span><span>${session.score} correct so far</span></div><h3 class="question" id="question" tabindex="-1">${fmt(q.q)}</h3><div class="options">${q.options.map((x,i)=>`<button class="option ${session.selected!==null?(i===q.answer?'correct':i===session.selected?'wrong':''):''}" data-${review?'review-answer':'answer'}="${i}" ${session.selected!==null?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('')}</div>${session.selected!==null?`<div class="feedback" role="status"><strong>${session.selected===q.answer?'That’s right.':'Not quite. The answer is '+esc(q.options[q.answer])+'.'}</strong><p>${fmt(q.why)}</p></div><div class="row" style="margin-top:20px"><button class="btn" id="${review?'review-next':'quiz-next'}" ${review&&(session.pending||session.error)?'disabled':''}>${review&&session.pending?'Saving answer…':session.index===total-1?'See my score':'Next question'} ${icon('arrow')}</button>${review&&session.error?'<button class="link" id="review-retry">Retry saving answer</button>':''}</div>${review&&session.error?`<p class="err" role="alert">Your answer could not be saved. ${esc(session.error)}</p>`:''}`:''}`}
function conceptList(){return `<ol class="content-list">${(cur.concepts||[]).map((text,i)=>{const recap=/^recap:\s*/i.test(text),known=cur.known?.[i];return `<li class="${known?'concept-known':''}"><div class="concept-copy">${recap?'<span class="concept-recap">Recap</span>':''}${fmt(recap?text.replace(/^recap:\s*/i,''):text)}${known?`<span class="tag">You learned this in ${esc(known)}</span>`:''}</div></li>`}).join('')}</ol>`}
async function loadFile(i){const c=course,l=cur,path=l.files[i],request=++fileRequest;if(path===undefined)return;document.querySelectorAll('[data-file]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.file===i?'true':'false'));const el=$('#file-content');el.innerHTML='<p class="muted" role="status">Reading file…</p>';try{const r=await api('POST','file',{course:c.id,path});if(request!==fileRequest||cur!==l||activeStep!=='read'||!el.isConnected)return;el.innerHTML=`<p class="file-heading">${esc(path)}</p><div class="code-viewer" tabindex="0" role="region" aria-label="${esc(path)} — read-only code, scroll to read"></div>`;const viewer=el.querySelector('.code-viewer');if(r.text){const fragment=document.createDocumentFragment();String(r.text).split('\n').forEach(line=>{const span=document.createElement('span');span.className='code-line';span.textContent=line||' ';fragment.append(span)});viewer.append(fragment)}}catch(e){if(request!==fileRequest||cur!==l||activeStep!=='read'||!el.isConnected)return;el.innerHTML=`<p class="err" role="alert">${e.status===404?'This file is gone or isn’t readable. Choose another file, or check the project folder.':esc(e.message)}</p>`}}
async function review(){const v=routeVersion,r=await api('GET','review');if(v!==routeVersion)return;reviewData=r;reviewSession={index:0,score:0,selected:null,finished:false,pending:false,error:''};renderReview()}
function renderReview(focus=false){const s=reviewSession,qs=reviewData.questions;app.innerHTML=`<div class="wrap review-wrap"><div class="intro"><div><div class="kicker">${icon('Practise')} A little recall goes a long way</div><h1>Daily review</h1></div><a href="#/">Back to Today</a></div>${!qs.length?'<div class="note"><h2>Nothing due today.</h2><p>You’re up to date. Your next lesson is waiting on Today.</p><a class="btn" href="#/">Back to Today</a></div>':s.finished?`<div class="score" tabindex="-1"><strong>${s.score} / ${qs.length}</strong><h3>Review complete.</h3><p>Right answers return later. Missed ones come back tomorrow, so you can try them again while they’re fresh.</p>${reviewData.count>qs.length?`<p>${reviewData.count-qs.length} more questions are due today.</p><button class="btn secondary" id="review-more">Review another set</button> `:''}<a class="btn" href="#/">Back to Today ${icon('arrow')}</a></div>`:`<div class="review-progress"><span class="bar"><i style="width:${s.index/qs.length*100}%"></i></span></div><section class="lesson-content"><div class="review-context"><p>${esc(qs[s.index].roadmap)}</p><h2>${esc(qs[s.index].lesson_title)}</h2></div><div class="step-body">${quizQuestion(qs[s.index],s,qs.length,true)}<p class="keyboard-hint">A–${String.fromCharCode(64+qs[s.index].options.length)} or 1–${qs[s.index].options.length} to answer · Enter to continue</p></div></section>`}</div>`;if(focus)($('#review-next')||$('#question')||$('.score'))?.focus({preventScroll:true})}
async function reviewAnswer(i){const s=reviewSession,q=reviewData.questions[s.index];if(s.finished||s.selected!==null||!Number.isInteger(i)||i<0||i>=q.options.length)return;s.selected=i;if(i===q.answer)s.score++;await saveReviewAnswer()}
async function saveReviewAnswer(){const s=reviewSession;if(s.pending)return;const q=reviewData.questions[s.index];s.pending=true;s.error='';renderReview();try{await api('POST','review',{course:q.course,lesson:q.lesson,i:q.i,right:s.selected===q.answer})}catch(e){s.error=e.message}finally{s.pending=false;if(reviewSession===s&&location.hash==='#/review')renderReview(true)}}
function reviewNext(){const s=reviewSession;if(s.selected===null||s.pending||s.error||s.finished)return;if(s.index===reviewData.questions.length-1)s.finished=true;else{s.index++;s.selected=null}renderReview(true)}
function closeSwitcher(focus=false){$('#switch-menu').hidden=true;$('#switch-toggle').setAttribute('aria-expanded','false');if(focus)$('#switch-toggle').focus()}
async function toggleSwitcher(){const menu=$('#switch-menu');if(!menu.hidden){closeSwitcher();return}menu.hidden=false;$('#switch-toggle').setAttribute('aria-expanded','true');menu.innerHTML='<p role="status">Loading roadmaps…</p>';const c=course;try{const list=await api('GET','courses');if(course!==c||menu.hidden)return;const others=list.filter(x=>!x.paused&&x.id!==c.id&&x.next&&x.done<x.total);menu.innerHTML=others.length?others.map(x=>`<a role="menuitem" tabindex="-1" href="${href(x.id,x.next.id)}"><b>${esc(x.title)}</b><span>Next: ${esc(x.next.title)}</span></a>`).join(''):'<p>No other active roadmaps.</p>';menu.querySelector('a')?.focus()}catch(e){menu.textContent=e.message}}

function renderExercise(ex){const code=S().code[cur.id]??ex.starter,run=runStates[chatKey()];return `<section class="exercise"><div class="kicker">${icon('Practise')} Make it work · ${esc(languageName(ex.lang))}</div><h3>${esc(ex.title)}</h3><p>${fmt(ex.prompt)}</p><div class="code-label"><label for="code">Your code</label><span>Tab = 4 spaces</span></div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off">${esc(code)}</textarea><div class="row run-actions"><button class="btn" id="run-code" ${run?.running||run?.installing?'disabled':''}>${icon('Watch')} Run</button><button class="btn secondary" id="run-tests" ${run?.running||run?.installing?'disabled':''}>${icon('Done when')} Run tests</button><button class="link" id="reset-code" ${run?.running||run?.installing?'disabled':''}>Reset to starter</button></div><div class="output ${run&&!run.running&&!run.installing&&!run.missing&&!run.error?(run.ok?'passed':'failed'):''}"><div class="output-header" role="status">${run?.running||run?.installing?runningArt():''}${run?.installing?'Installing '+esc(languageName(run.missing))+'…':run?.running?(run.test?'Running tests…':'Running code…'):run?.missing?esc(languageName(run.missing))+' is needed':run?.error?'Run couldn’t finish':run?run.test?(run.ok?'Tests passed':'Tests failed'):(run.ok?'Run finished':'Run failed'):'Output'}</div><pre id="output">${esc(run?.installing?'Finish the system password dialog if it is open. Installation can take several minutes; you can keep reading while it runs.':run?.running?'Compiling and running can take up to 60 seconds. You can keep reading while it runs.':run?.output??'Run your code to see the result here.')}</pre>${run?.missing?`<div class="install-note"><p>${run.installing?'The system is installing a package. Keep the app open until it finishes.':'This installs a system package and will ask for your password.'}</p><button class="btn secondary" id="install-lang" ${run.installing?'disabled':''}>${run.installing?'Installing…':'Install '+esc(languageName(run.missing))}</button>${run.installError?`<p class="err" role="alert">${esc(run.installError)}</p>`:''}</div>`:''}</div><details><summary>View the tests</summary><pre>${esc(ex.tests)}</pre></details></section>`}
function answer(i){const s=sessions[chatKey()],q=cur.practice.quiz[s.index];if(s.finished||s.selected!==null||!Number.isInteger(i)||i<0||i>=q.options.length)return;s.selected=i;if(i===q.answer)s.score++;renderPractice();$('#quiz-next')?.focus({preventScroll:true})}
function quizNext(){const s=sessions[chatKey()];if(s.selected===null)return;if(s.index===cur.practice.quiz.length-1){s.finished=true;s.total=cur.practice.quiz.length;S().quiz[cur.id]={score:s.score,total:s.total};save()}else{s.index++;s.selected=null}renderPractice();($('#question')||$('.score'))?.focus({preventScroll:true})}
const LANGUAGES={python:'Python',javascript:'JavaScript',bash:'Bash',ruby:'Ruby',php:'PHP',lua:'Lua',c:'C',cpp:'C++',rust:'Rust',go:'Go',java:'Java'};
const languageName=lang=>LANGUAGES[lang]||lang;
const runningArt=()=>'<svg class="running-route" viewBox="0 0 52 20" aria-hidden="true"><path d="M0 15h12c14 0 4-10 18-10h22"/></svg>';
async function runCode(test){const c=course,l=cur,key=chatKey();if(runStates[key]?.running||runStates[key]?.installing)return;const code=$('#code').value;S().code[l.id]=code;save();runStates[key]={running:true,test,code};renderPractice();try{const r=await api('POST','run',{course:c.id,lesson:l.id,code,test});runStates[key]={...r,test,code}}catch(e){runStates[key]={error:true,output:e.message,test}}if(cur===l&&activeStep==='practice')renderPractice()}
async function installLanguage(){const c=course,l=cur,key=chatKey(),run=runStates[key];if(!run?.missing||run.installing)return;run.installing=true;delete run.installError;renderPractice();try{const installed=await api('POST','install',{lang:run.missing});if(!installed.ok){run.installError=installed.output||'Installation did not finish.';return}runStates[key]={running:true,test:run.test,code:run.code};if(cur===l&&activeStep==='practice')renderPractice();try{const result=await api('POST','run',{course:c.id,lesson:l.id,code:run.code,test:run.test});runStates[key]={...result,test:run.test,code:run.code}}catch(e){runStates[key]={error:true,output:e.message,test:run.test,code:run.code}}}catch(e){run.installError=e.message}finally{run.installing=false;if(cur===l&&activeStep==='practice')renderPractice()}}
const BASES={gemini:['https:','','generativelanguage.googleapis.com','v1beta','openai'].join('/'),openrouter:['https:','','openrouter.ai','api','v1'].join('/'),ollama:['http:','','localhost:11434','v1'].join('/')};
async function settings(){const v=routeVersion,c=await api('GET','settings');if(v!==routeVersion)return;app.innerHTML=`<div class="wrap narrow"><div class="intro"><h1>Settings</h1><a href="#/">Back to roadmaps</a></div><div class="settings-layout appearance"><div><h3>Appearance</h3><p class="muted">Light, dark, or whatever your desktop uses.</p></div><fieldset id="theme"><legend class="sr">Theme</legend>${[['light','Light'],['dark','Dark'],['system','Follow system']].map(([k,n])=>`<label><input type="radio" name="theme" value="${k}" ${c.theme===k?'checked':''}> ${n}</label>`).join('')}</fieldset></div><div class="settings-layout"><div><h3>AI service</h3><p class="muted">Connect an OpenAI-compatible AI service. Your key stays on this computer.</p><p class="small">Roadmap uses it to plan lessons, prepare practice, and give you hints.</p></div><form id="settings"><label for="base">Base URL</label><input type="url" id="base" required value="${esc(c.base)}" placeholder="Your service’s API base URL"><p class="small" style="margin:12px 0 0">Quick fill</p><div class="examples">${[['gemini','Google Gemini'],['openrouter','OpenRouter'],['ollama','Ollama on this computer']].map(([k,n])=>`<button type="button" data-base="${k}">${n}</button>`).join('')}</div><label for="model">Model name</label><input id="model" required value="${esc(c.model)}"><label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="${c.key_set?'Saved. Leave empty to keep it.':'Not needed for a local Ollama model'}"><p class="save row"><button class="btn">Save settings</button><span id="saved" role="status"></span></p></form></div></div>`}
async function route(){const v=++routeVersion;clearTimeout(videoTimer);closeSwitcher();cur=null;if(saveFn){clearTimeout(saveT);await saveFn()}if(v!==routeVersion)return;const [,a,rawId,rawLid]=location.hash.split('/');app.innerHTML='<div class="wrap narrow loading" role="status">Opening your roadmap…</div>';try{if(a==='c'&&rawId){const id=decodeURIComponent(rawId);if(!course||course.id!==id){const c=await api('GET','courses/'+enc(id));if(v!==routeVersion)return;course=normalize(c)}renderTop();return rawLid?lesson(decodeURIComponent(rawLid)):overview()}course=null;renderTop();await(a==='settings'?settings():a==='review'?review():library())}catch(e){if(v!==routeVersion)return;course=null;renderTop();app.innerHTML=`<div class="wrap narrow"><p class="err">${esc(e.message)}</p><a href="#/">Back to your roadmaps</a></div>`}}
document.addEventListener('change',async e=>{if(e.target.name!=='theme')return;document.documentElement.dataset.theme=e.target.value;try{await api('PUT','theme',{theme:e.target.value})}catch(err){toast(err.message)}});
document.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='new')create(e.target);else if(e.target.id==='compose')ask($('#msg').value);else if(e.target.id==='settings'){const button=e.target.querySelector('button.btn');button.disabled=true;try{await api('PUT','settings',{base:$('#base').value,model:$('#model').value,key:$('#key').value});if($('#key')){$('#key').value='';$('#saved').textContent='Settings saved.'}}catch(err){toast(err.message)}finally{button.disabled=false}}});
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||t.disabled)return;if(t.id==='switch-toggle'){toggleSwitcher();return}if(t.id==='pick-folder'){pickFolder();return}if(t.dataset.file!==undefined){loadFile(+t.dataset.file);return}if(t.dataset.reviewAnswer!==undefined){reviewAnswer(+t.dataset.reviewAnswer);return}if(t.id==='review-more'){review().catch(err=>toast(err.message));return}if(t.id==='review-next'){reviewNext();return}if(t.id==='review-retry'){saveReviewAnswer();return}if(t.id==='install-lang'){installLanguage();return}if(t.dataset.pause){t.disabled=true;try{await api('PUT','courses/'+enc(t.dataset.pause)+'/paused',{paused:t.dataset.paused==='true'});if(t.isConnected)await library()}catch(err){toast(err.message);t.disabled=false}return}if(t.dataset.base){$('#base').value=BASES[t.dataset.base];return}if(t.dataset.example){$('#prompt').value=t.dataset.example;$('#prompt').focus();return}if(t.id==='add-roadmap')showCreation();else if(t.id==='cancel-new')renderLibrary();else if(t.dataset.del){if(!confirm(`Delete "${t.dataset.title}" and all its progress? This can't be undone.`))return;try{await api('DELETE','courses/'+enc(t.dataset.del));if(t.isConnected)await library()}catch(err){toast(err.message)}}else if(t.dataset.practiceView){practiceViews[chatKey()]=t.dataset.practiceView;renderPractice();document.querySelector('[data-practice-view='+t.dataset.practiceView+']').focus({preventScroll:true})}else if(t.dataset.step)showStep(t.dataset.step,true);else if(t.dataset.video!==undefined)showVideo(+t.dataset.video);else if(t.id==='play-video')playVideo(+t.dataset.index);else if(t.id==='retry-videos')loadVideos(cur,course);else if(t.dataset.ask)ask(t.dataset.ask);else if(t.dataset.copy!==undefined){const phrase=cur.lookups[+t.dataset.copy];try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(phrase);else{const input=document.createElement('textarea');input.value=phrase;input.style.position='fixed';input.style.top='-1000px';document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();t.focus();if(!ok)throw Error('Copy unavailable')}toast('Search phrase copied.')}catch(err){toast('Copy unavailable. Select the phrase and copy it with Ctrl+C.')}}else if(t.id==='load-practice'||t.id==='retry-practice')loadPractice(t.id==='retry-practice'&&!!practiceFresh[chatKey()]);else if(t.id==='fresh-practice')loadPractice(true);else if(t.id==='quiz-again'){delete sessions[chatKey()];delete S().quiz[cur.id];save();renderPractice();$('#question')?.focus({preventScroll:true})}else if(t.dataset.answer!==undefined)answer(+t.dataset.answer);else if(t.id==='quiz-next')quizNext();else if(t.id==='run-code')runCode(false);else if(t.id==='run-tests')runCode(true);else if(t.id==='reset-code'){if(confirm('Replace your code with the starter? Your edits will be lost.')){S().code[cur.id]=cur.practice.exercise.starter;delete runStates[chatKey()];save();renderPractice()}}else if(t.id==='finish'){if(S().done[cur.id])delete S().done[cur.id];else if(checked(cur).every(Boolean))S().done[cur.id]=true;else return;save();finishUI();renderRail();if(S().done[cur.id]){const next=all()[all().indexOf(cur)+1],phase=course.phases.find(p=>p.lessons.includes(cur)),achievement=all().every(l=>S().done[l.id])?'Roadmap complete':phase.lessons.every(l=>S().done[l.id])?'Phase milestone reached':'Lesson complete';$('#fstate').className='celebrate';$('#fstate').innerHTML=`<strong>${achievement}</strong><p>One more stop behind you. Keep that momentum.</p>${next?`<a class="btn" href="${href(course.id,next.id)}">Next lesson ${icon('arrow')}</a>`:`<a class="btn" href="${href(course.id)}">See your completed route</a>`}`;const burst=document.createElement('div');burst.className='burst';burst.innerHTML=Array.from({length:24},(_,i)=>`<i style="--x:${(i-12)*28}px;--r:${i*37}deg"></i>`).join('');document.body.append(burst);setTimeout(()=>burst.remove(),1100)}}});
document.addEventListener('change',e=>{if(e.target.name==='kind'){setCreationKind(e.target.value);return}const k=e.target.dataset.check;if(k===undefined||!cur)return;if(e.target.checked)S().checks[cur.id+'#'+k]=true;else delete S().checks[cur.id+'#'+k];save();finishUI()});
document.addEventListener('input',e=>{if(!cur)return;if(e.target.id==='notes'){S().notes[cur.id]=e.target.value;save()}else if(e.target.id==='code'){S().code[cur.id]=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.target.id==='msg'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.target.value)}if(e.target.id==='code'&&e.key==='Tab'&&!e.shiftKey){e.preventDefault();const el=e.target,start=el.selectionStart;el.setRangeText('    ',start,el.selectionEnd,'end');S().code[cur.id]=el.value;save()}});

document.addEventListener('click',e=>{if(!e.target.closest('#switcher'))closeSwitcher();const phase=e.target.closest('[data-phase]');if(phase){e.preventDefault();document.getElementById('phase-'+phase.dataset.phase)?.scrollIntoView({block:'start'})}});
document.addEventListener('keydown',e=>{const menu=$('#switch-menu');if(!menu.hidden){const items=[...menu.querySelectorAll('[role=menuitem]')];if(e.key==='Escape'){e.preventDefault();closeSwitcher(true)}else if(e.key==='Tab')closeSwitcher(true);else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const i=items.indexOf(document.activeElement);items[e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowUp'?-1:1)+items.length)%items.length]?.focus()}return}if(e.target.closest('textarea,input,select')||e.ctrlKey||e.altKey||e.metaKey)return;if(location.hash==='#/review'&&reviewSession&&!reviewSession.finished){const s=reviewSession;if(s.selected===null){const i=/^[1-9]$/.test(e.key)?+e.key-1:/^[a-z]$/i.test(e.key)?e.key.toUpperCase().charCodeAt(0)-65:-1;if(i>=0&&i<reviewData.questions[s.index].options.length){e.preventDefault();reviewAnswer(i)}}else if(e.key==='Enter'&&!s.pending&&!s.error){e.preventDefault();reviewNext()}}else if(e.target.id==='switch-toggle'&&e.key==='ArrowDown'){e.preventDefault();toggleSwitcher()}});

addEventListener('hashchange',route);route();
</script>
