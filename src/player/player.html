<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font: 13px/1.2 system-ui, sans-serif; color: #fff; }
#wrap { position: relative; width: 100%; height: 100%; }
#player { position: absolute; border: 0; }
/* Covers YouTube's own frame so its hover title, share and suggestion overlays never wake up. */
#shield { position: absolute; inset: 0; cursor: pointer; }
#cover { position: absolute; inset: 0; display: none; place-items: center; background: #000; }
#wrap.ended #cover { display: grid; }
#bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 22px 12px 10px; background: linear-gradient(transparent, rgba(0,0,0,.9) 45%); transition: opacity .2s; }
#wrap.idle #bar { opacity: 0; pointer-events: none; }
#wrap.idle { cursor: none; }
select { -webkit-appearance: none; appearance: none; background: rgba(255,255,255,.12); color: #fff; padding: 4px 8px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
[hidden] { display: none !important; }
#cc[aria-pressed=true] { background: #fff; color: #000; }
#cc:disabled { opacity: .4; cursor: default; background: none; }
#caption { position: absolute; left: 5%; right: 5%; bottom: 64px; text-align: center; pointer-events: none; transition: bottom .2s; }
#wrap.idle #caption { bottom: 16px; }
#caption span { display: inline; padding: 2px 8px; background: rgba(0,0,0,.78); font-size: clamp(14px, 3.6vh, 30px); line-height: 1.45; -webkit-box-decoration-break: clone; box-decoration-break: clone; white-space: pre-line; }
button { background: none; border: 0; color: inherit; font: inherit; padding: 4px; border-radius: 6px; cursor: pointer; display: inline-grid; place-items: center; }
button:hover, button:focus-visible, select:hover, select:focus-visible { background: rgba(255,255,255,.25); outline: none; }
select option { color: #000; }
svg { width: 20px; height: 20px; fill: currentColor; }
#time { font-variant-numeric: tabular-nums; white-space: nowrap; opacity: .9; }
#seek { flex: 1; min-width: 40px; accent-color: #fff; cursor: pointer; }
#replay { padding: 10px 18px; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; gap: 6px; grid-auto-flow: column; }
</style>
</head>
<body>
<div id="wrap">
  <div id="player"></div>
  <div id="shield" aria-hidden="true"></div>
  <div id="cover"><button id="replay" type="button" title="Replay"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>Replay</button></div>
  <div id="caption" hidden><span></span></div>
  <div id="bar">
    <button id="play" type="button" aria-label="Play" title="Play (K or Space)"><svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg></button>
    <span id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Position" title="Skip 5s: ← →  ·  Skip 10s: J L">
    <button id="cc" type="button" aria-label="Captions" aria-pressed="false" disabled title="Loading captions…"><b>CC</b></button>
    <select id="rate" aria-label="Speed" title="Playback speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <button id="mute" type="button" aria-label="Mute" title="Mute (M)"><svg viewBox="0 0 24 24"><path id="mute-icon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <button id="full" type="button" aria-label="Full screen" title="Full screen (F, or double-click the video)"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
  </div>
</div>
<script src="player.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
