[package]
name = "roadmap-app"
version = "0.2.0"
edition = "2021"
default-run = "roadmap-app"
rust-version = "1.92"

[dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1"
tempfile = "3"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["native-certs"] }

[profile.release]
strip = true
lto = "thin"
