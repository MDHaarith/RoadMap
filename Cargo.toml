[package]
name = "roadmap-app"
version = "1.0.2"
edition = "2021"
default-run = "roadmap-app"
rust-version = "1.92"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
dirs = "6"
getrandom = "0.3"
tauri = { version = "2", features = [] }
# The desktop's own file chooser (KDE's on Plasma) through the portal, not GTK's.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1"
tempfile = "3"
ureq = { version = "2.12", features = ["native-certs"] }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Unpacks the Deno download (yt-dlp needs a JavaScript runtime for YouTube); already in the Windows and macOS builds through the updater.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-notification = "2"

# statvfs for the exercise sandbox's disk watch; already in the build through other crates.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Job objects that cap an exercise's memory and processes; already in the build through other crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = "thin"
